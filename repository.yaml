# repository.yaml — Machine-readable Repository Contract (Source of Truth)
#
# Zweck: Eine einzige Datei, die beschreibt WAS dieses Repository ist,
# woraus es besteht und welche Regeln gelten — maschinenlesbar, damit
# Skills/MCP-Server/Tools sich hieran orientieren koennen statt Wissen
# zu erraten oder zu duplizieren.
#
# Quelle der Wahrheit bleibt weiterhin AGENTS.md fuer Verhaltensregeln
# und docs/00-foundation/Immutable-Law-Catalog.md fuer Technologie-Regeln.
# repository.yaml verweist auf diese, statt sie zu duplizieren.
#
# Stand: 2026-09-10. AI-AGENTS-CLI.md und mcp_research.md unter docs/30-meta/ (Root aufgeraeumt).

schema_version: 1

project:
  name: DIN-BriefNEO
  description: >
    Vanilla-JS/HTML/CSS Webanwendung zur Erstellung DIN-5008-konformer
    Geschaeftsbriefe. Kein Build-Step, keine npm-Abhaengigkeiten,
    Deployment ueber GitHub Pages.
  governance_contract: AGENTS.md
  law_catalog: docs/00-foundation/Immutable-Law-Catalog.md
  browser_agent_guide: docs/30-meta/AI-AGENTS-CLI.md
  platform_research_roadmap: docs/30-meta/mcp_research.md
  workflow_modes: [light, full]
  branching: branchless-on-main
  fitness_gate:
    required_score: 100
    entrypoint: node tools/build_db.js
    engine: tools/reconciliation.js

structure:
  docs/30-meta/AI-AGENTS-CLI.md:
    purpose: >
      Kurzguide: Chrome DevTools MCP an die laufende App haengen.
      Sichtpruefung A4-Viewport, Sidebar, Anrede, Postvermerk.
      Kein Gesetz, keine Foundation.

  docs/30-meta/mcp_research.md:
    purpose: >
      Roadmap: Plattform-APIs (BCD, chromestatus) on demand nachschlagen,
      ohne Catalog oder Baseline zu ueberschreiben. Kein laufender Dienst.

  website/:
    purpose: Ausgelieferte Anwendung (das eigentliche Produkt)
    subpaths:
      website/js/: ES-Module (core, persistence, document, settings, salutation, address, main)
      website/css/: Layered CSS (base, sidebar, sheet, print)
      website/index.html: Einstiegspunkt

  tools/:
    purpose: Build-, Validierungs- und Wartungsskripte inkl. Fitness Gate & lokaler Dev-Server
    subpaths:
      tools/build_db.js: Fitness-Check + Build, Pflicht vor/nach jeder Aenderung (AGENTS.md Paragraph 2)
      tools/dev_server.ps1: Live-Reload-Webserver (Port 8088), reines PowerShell/.NET, kein Python/Node.js noetig
      tools/antipatterns/: JSON-Regeldateien fuer den Scrub-Check (base/web/project layered)
    inventory_doc: docs/30-meta/tooling-overview.md

  docs/:
    purpose: Dokumentation nach Schema V6 (YAML-Frontmatter-Pflicht)
    subpaths:
      docs/00-foundation/: Verfassung, Gesetzeskatalog, Grundprinzipien
      docs/10-architecture/: ADRs, Architektur-Entscheidungen
      docs/20-implementation/: Feature-spezifische Implementierungs-Guides
      docs/30-meta/: Meta-Dokumentation (Schema, Changelog, Decision-Log, Templates, Prozess-/Workflow-Policies)
    schema: docs/30-meta/schema-v6.json

  skills/:
    purpose: >
      Agenten-Skills und Entscheidungslogik im Projekt-Root.
      Beschreibt Capability-Exposition, Workflows und Leitplanken (das WANN und WAS).
    subpaths:
      skills/repository-operations/: Kanonische Entscheidungslogik fuer Repository-Arbeit (5-Schritt-Workflow, Discipline/Economy Layer, Recherche-Pyramide und HTML->CSS->JS-Leiter)
      skills/architecture-drift-audit/: Periodischer Soll/Ist-Abgleich der Architektur (siehe docs/90-archive/architecture-drift-audit-2026-08-27.md fuer den ersten Durchlauf)
      skills/modern-css/: Kanonische CSS-Architektur der 4 Stylesheets, 100% OKLCH-Farb-Tokens (Law W4), logische Properties und DIN-5008-Drucksimulation
      skills/modern-html/: Tier-1 HTML-Leitfaden fuer deklarative Formularvalidierung, Popovers, Invoker Commands, DIN-5008-Custom-Elements und Lighthouse-100 ARIA
      skills/modern-javascript/: Vanilla JS Architektur fuer Chromium 150+, Law A61 DOM-XSS-Verbot, LocalStorage/IndexedDB, fetchGzipJson und EventBus
    status: aktiv
    decided_over: agent/skills/ (flach im Projekt-Root konsolidiert)

  build/:
    purpose: Generierte Artefakte (SQLite-DB-Import, Matrizen). Liegt extern unter ~/.din-briefneo/build/.
    regenerate_with: tools/build_db.js


   .github/:
    purpose: GitHub Actions Workflows & Templates
    subpaths:
      .github/workflows/deploy.yml: GitHub Pages Deployment
      .github/workflows/fitness.yml: Fitness Gate CI
      .github/workflows/update_plz_data.yml: Quartalsweises PLZ-Update
      .github/ISSUE_TEMPLATE/bug_report.md: Bug Report Template
      .github/ISSUE_TEMPLATE/feature_request.md: Feature Request Template
      .github/ISSUE_TEMPLATE/config.yml: Issue Template Config
      .github/PULL_REQUEST_TEMPLATE.md: Pull Request Template

taxonomy:
  # Erzwungen vom Fitness Gate (tools/reconciliation.js, check_type "taxonomy"):
  # Jede GETRACKTE Datei muss entweder unter einem allowed_top_level-Ordner
  # oder in allowed_root_files liegen. Unbekannter Ort = Fehler (critical).
  allowed_top_level:
    - docs
    - website
    - skills
    - tools
    - test
    - specs
    - .github
    - githooks
    - todo
    - build
    - Papierkorb
  allowed_root_files:
    - AGENTS.md
    - README.md
    - ACCESSIBILITY.md
    - CONTRIBUTING.md
    - CODE_OF_CONDUCT.md
    - CLAUDE.md
    - GEMINI.md
    - HANDOFF.md
    - LICENSE
    - SECURITY.md
    - repository.yaml
    - opencode.json
    - jsconfig.json
    - biome.json
    - package.json
    - start.bat
    - start.sh
    - envelope.svg
    - TODO.md
    - skills-lock.json
    - .gitignore
    - .gitattributes
  roles:
    website: Produkt (HTML/CSS/JS/Daten), kein Build-Step
    docs: Lebende Doku (00-foundation/10-architecture/20-implementation/30-meta)
    skills: Kanonische Agent-Skills & Workflow-Entscheidungslogik (SSoT)
    tools: Build/Gate/Tooling (Node, zero-dep)
    test: Zero-Dependency Unit-Tests
    specs: Full-Mode-Specs (spec.md/plan.md)
    build: generiert, gitignored
    .github: CI-Workflows
    todo: Arbeitsvorrat und Planungsnotizen (keine lebende Doku)

entrypoints:
  build: tools/build_db.js
  serve: start.bat
  serve_linux: start.sh
  browser_agent: docs/30-meta/AI-AGENTS-CLI.md
  platform_research: docs/30-meta/mcp_research.md

vocabulary_ref: docs/30-meta/tooling-overview.md

tool_inventory_ref: docs/30-meta/tooling-overview.md

open_items:
  # Punkte aus dem ChatGPT-Brainstorm, die repository.yaml bewusst NICHT
  # abschliessend loest, weil sie ausserhalb des Scopes von Lauf 1+2 liegen.
  - id: agenten-infrastruktur-entschlacken
    description: start.ps1-Pipeline laeuft weiterhin komplett bei jedem Aufruf, wurde nicht hinterfragt (siehe Antwort 5).
    status: done
    resolved_note: >
      Hash-basiertes Caching fuer create_context.js und build_db.py
      implementiert (tools/pipeline-cache.ps1, Commit 753681c). Fitness Gate
      (build_db.js/reconciliation.js) bewusst weiterhin ungecacht, siehe
      AGENTS.md Paragraph 2.
  - id: plan-execute-verify-zustandslos
    description: >
      repository.execute erzwingt Plan->Execute->Verify nicht technisch --
      ein execute-Aufruf ohne vorherigen plan:true-Aufruf wird nicht
      abgelehnt, es gibt keine Bindung (plan_id/Repo-Hash) zwischen einem
      Plan-Aufruf und dem nachfolgenden echten Execute. Gefunden bei
      externem Review (ChatGPT, 2026-08-27, Ist-Pruefung gegen Antwort 9).
    status: done
    resolved_note: >
      plan_id + SHA256-Hash der von der Aktion betroffenen Dateien
      technisch erzwungen, dateibasiert unter ~/.din-briefneo/cache/plans/,
      TTL 600s, Single-Use (Commit 60ff87a). Live gegen den echten Server
      verifiziert (kein Plan -> blocked, falsche plan_id -> blocked,
      geaenderter Repo-Zustand zwischen Plan und Execute -> blocked).
  - id: intent-verification-minimal
    description: >
      Verify nach repository.execute prueft per Hash-Vergleich nur OB sich
      der outputPath einer Aktion geaendert hat, nicht OB die Aenderung
      inhaltlich korrekt ist. Bewusste, dokumentierte Grenze -- inhaltliche
      Korrektheit bleibt Aufgabe des Fitness Gate (tools/reconciliation.js),
      nicht des MCP-Servers. Siehe docs/90-archive/architecture-drift-audit-2026-08-27.md.
    status: accepted_limitation
  - id: platform-research-on-demand
    description: >
      Agent soll BCD/chromestatus fragen koennen, ohne Catalog zu schreiben.
      Spezifiziert in docs/30-meta/mcp_research.md. Noch kein Implementierungsauftrag.
    status: open
    spec: docs/30-meta/mcp_research.md
