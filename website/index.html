      try {
        const defaults = { theme: 'light' };
        const raw = localStorage.getItem('din_settings');
        const settings = raw ? Object.assign(defaults, JSON.parse(raw)) : defaults;
        document.documentElement.style.colorScheme = settings.theme === 'dark' ? 'dark' : 'light';
        const customFont = localStorage.getItem('din_custom_font');
        if (customFont) {

          fontStyle.id = 'din-custom-font-style';
          fontStyle.textContent = `@font-face { font-family: 'AptosCustom'; src: url('${customFont}') format('woff2'); }`;
          document.head.appendChild(fontStyle);

        <p>Möchtest du alle Texte wirklich zurücksetzen?</p>

          <button value="cancel" class="btn">Abbrechen</button>
          <button value="confirm" class="btn danger" id="btn-confirm-reset">Zurücksetzen</button>
        </div>
      </form>
    </dialog>
    <script>
      try {
        const defaults = {
          theme: 'light',
          layout: 'form-b',
          guides: true,
          systemFont: 'sans',
          formality: 'formal',
          postvermerkActive: false
        };
        const raw = localStorage.getItem('din_settings');
        const settings = raw ? Object.assign(defaults, JSON.parse(raw)) : defaults;
        function setRadioSync(name, val) {
          document.querySelectorAll(`input[type="radio"][name="${name}"]`).forEach((b) => {
            const on = b.value === val;
            b.checked = on;
            if (on) b.setAttribute('checked', '');
            else b.removeAttribute('checked');
          });
        }
        setRadioSync('theme', settings.theme === 'dark' ? 'dark' : 'light');
        setRadioSync('layout-form', settings.layout);
        setRadioSync('salutation', settings.formality);
        setRadioSync('font-stack', settings.systemFont);
        setRadioSync('guides', settings.guides ? 'on' : 'off');
        const pvToggleBtn = document.getElementById('toggle-postvermerk');
        if (pvToggleBtn) {
          pvToggleBtn.checked = !!settings.postvermerkActive;
          if (settings.postvermerkActive) pvToggleBtn.setAttribute('checked', '');
          else pvToggleBtn.removeAttribute('checked');
        }
        const draftStr = localStorage.getItem('din_draft_current');
        if (draftStr) {
          const draft = JSON.parse(draftStr);
          const parser = new DOMParser();
          for (const id in draft) {
            const el = document.getElementById(id);
            if (!el || !draft[id]) continue;
            if (el.tagName === 'SELECT') { el.value = draft[id]; continue; }
            const nested = el.querySelector && el.querySelector('select[data-persist]');
            if (nested) { nested.value = draft[id]; continue; }
            const doc = parser.parseFromString(draft[id], 'text/html');
            el.replaceChildren(...doc.body.childNodes);
          }
        }
        if (localStorage.getItem('din_custom_font')) {
          document.body.classList.add('font-custom-active');
          const status = document.getElementById('font-status-label');
          if (status) status.textContent = 'Aktiv: Eigene Schrift (WOFF2)';
        }
      } catch (e) {}
    </script>
