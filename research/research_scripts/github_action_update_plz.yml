name: Automated Postal Data Refresh (PLZ & Großempfänger)

on:
  schedule:
    # Runs quarterly at 04:00 UTC on the 1st of January, April, July, and October
    - cron: '0 4 1 */3 *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force full re-download (bypass ETag check)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install brotli

      - name: Execute postal data update pipeline
        id: pipeline
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            python research/research_scripts/update_plz_pipeline.py --force
          else
            python research/research_scripts/update_plz_pipeline.py
          fi

      - name: Handle regular healthy update (Auto-Commit)
        if: steps.pipeline.outputs.action_needed == 'auto_commit'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(data): automated quarterly update of German PLZ and Großempfänger [skip ci]"
          file_pattern: "research/research_results/ website/data/"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
          commit_author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"

      - name: Handle anomaly detection (Create Review Pull Request)
        if: steps.pipeline.outputs.action_needed == 'manual_review'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(data): anomalous postal data update requiring manual inspection"
          branch: "data-update-review"
          title: "⚠️ [Review erforderlich] Ungewöhnlich viele Änderungen im PLZ-Datensatz"
          body: |
            ## 🔍 Anomaly Drift Guard ausgelöst
            
            Die automatische Quartals-Pipeline hat ungewöhnlich viele Änderungen oder eine signifikante Größenabweichung festgestellt:
            - **Zusammenfassung:** ${{ steps.pipeline.outputs.summary }}
            - **Status:** Vor der Übernahme in `main` ist eine manuelle Sichtprüfung der Datei `research/research_results/de_plz_ort.review.json` erforderlich.
            
            Falls die Änderungen legitim sind, kann dieser PR einfach gemergt werden.
          labels: |
            data-review
            dependencies

      - name: Log idempotent / skip result
        if: steps.pipeline.outputs.action_needed == 'none'
        run: echo "Idempotent run: ${{ steps.pipeline.outputs.summary }}"
