name: Fitness Gate

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'tools/**'
      - 'test/**'
      - 'package.json'
      - '.github/workflows/fitness.yml'
  pull_request:
    paths:
      - 'website/**'
      - 'tools/**'
      - 'test/**'
      - 'package.json'
      - '.github/workflows/fitness.yml'
  workflow_dispatch:

concurrency:
  group: fitness-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fitness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Initialize Environment
        run: |
          bash tools/setup-din-home.sh || true

      - name: Fitness Gate + Retrieval-Index
        run: node tools/build_db.js -q

      - name: Biome (Lint, Version aus biome.json $schema)
        run: npx --yes @biomejs/biome@2.6.3 check website/

      - name: Test-Suite (headless, exit 1 bei Fehlschlag)
        run: node tools/test-runner.mjs --allow-missing-browser
