name: Fitness Gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: fitness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fitness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install TypeScript
        run: npm install -g typescript
      - name: Fitness Gate + Retrieval-Index
        run: node tools/build_db.js
