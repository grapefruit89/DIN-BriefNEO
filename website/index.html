    <script>
      try {
        const defaults = { theme: 'auto' };
        const raw = localStorage.getItem('din_settings');
        const settings = raw ? Object.assign(defaults, JSON.parse(raw)) : defaults;
        const theme = settings.theme || 'auto';
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.style.colorScheme = theme === 'auto' ? 'light dark' : theme;
        const customFont = localStorage.getItem('din_custom_font');
        if (customFont) {
          const fontStyle = document.createElement('style');
          fontStyle.id = 'din-custom-font-style';
          fontStyle.textContent = `@font-face { font-family: 'AptosCustom'; src: url('${customFont}') format('woff2'); }`;
          document.head.appendChild(fontStyle);
        }
      } catch (e) {}
    </script>

    <!-- 
      🛡️ BLEEDING EDGE ARCHITECTURE GUARD: NATIVE POPOVER TOP-LAYER TOAST
      ⚠️ ACHTUNG FÜR ZUKÜNFTIGE KIs / LLMs / DEVELOPER:
      Dieser Toast nutzt die native HTML Popover API (`popover="manual"`) und rendert
      direkt im Browser-Top-Layer über allen Dialogen, Modals und z-index-Ebenen.
      STRIKT VERBOTEN: z-index-Hacks, DOM-Mounting-Libraries oder JavaScript-Animationsschleifen
      einzuführen! Uebergänge laufen 100% deklarativ über CSS @starting-style. (ADR-ANTIPATTERN Abs. 15)
    -->
    <div id="toast-v4" popover="manual" class="toast-container type-info no-print" role="alert" aria-live="assertive" aria-atomic="true">
      <span id="toast-message"></span>
      <span id="toast-badge" class="toast-badge hidden"></span>

    <dialog id="reset-dialog" class="glass-dialog no-print">
      <form method="dialog">
        <p>Möchtest du alle Texte wirklich zurücksetzen?</p>
        <div class="dialog-actions">
          <button value="cancel" class="btn">Abbrechen</button>
          <button value="confirm" class="btn danger" id="btn-confirm-reset">Zurücksetzen</button>
        </div>
      </form>
    </dialog>
    <script>
      try {
        const defaults = {
          theme: 'auto',
          layout: 'form-b',
          guides: true,
          systemFont: 'sans',
          formality: 'formal',
          postvermerkActive: false
        };
        const raw = localStorage.getItem('din_settings');
        const settings = raw ? Object.assign(defaults, JSON.parse(raw)) : defaults;
        function setRadioSync(name, val) {
          document.querySelectorAll(`input[type="radio"][name="${name}"]`).forEach((b) => {
            const on = b.value === val;
            b.checked = on;
            if (on) b.setAttribute('checked', '');
            else b.removeAttribute('checked');
          });
        }
        setRadioSync('layout-form', settings.layout);
        setRadioSync('salutation', settings.formality);
        setRadioSync('font-stack', settings.systemFont);
        setRadioSync('guides', settings.guides ? 'on' : 'off');
        const activeTheme = settings.theme || 'auto';
        document.documentElement.setAttribute('data-theme', activeTheme);
        const scheme = activeTheme === 'auto' ? 'light dark' : activeTheme;
        document.documentElement.style.colorScheme = scheme;
        if (document.body) {
          document.body.setAttribute('data-theme', activeTheme);
          document.body.style.colorScheme = scheme;
        }
        const themeToggleBtn = document.getElementById('btn-theme-toggle');
        if (themeToggleBtn) {
          themeToggleBtn.setAttribute('data-appearance', activeTheme);
          const labels = { auto: '🌓 Auto', light: '☀️ Hell', dark: '🌙 Dunkel' };
          const titles = { auto: 'Darstellung: Automatisch (System)', light: 'Darstellung: Helles Design', dark: 'Darstellung: Dunkles Design' };
          themeToggleBtn.setAttribute('data-ui', labels[activeTheme] || '🌓 Auto');
          themeToggleBtn.setAttribute('title', titles[activeTheme] || 'Darstellung: Automatisch');
          themeToggleBtn.setAttribute('aria-label', titles[activeTheme] || 'Darstellung: Automatisch');
        }
        const pvToggleBtn = document.getElementById('toggle-postvermerk');
        if (pvToggleBtn) {
          pvToggleBtn.checked = !!settings.postvermerkActive;
          if (settings.postvermerkActive) pvToggleBtn.setAttribute('checked', '');
          else pvToggleBtn.removeAttribute('checked');
        }
        const draftStr = localStorage.getItem('din_draft_current');
        if (draftStr) {
          const draft = JSON.parse(draftStr);
          const parser = new DOMParser();
          for (const id in draft) {
            const el = document.getElementById(id);
            if (!el || !draft[id]) continue;
            if (el.tagName === 'SELECT') { el.value = draft[id]; continue; }
            const nested = el.querySelector && el.querySelector('select[data-persist]');
            if (nested) { nested.value = draft[id]; continue; }
            const doc = parser.parseFromString(draft[id], 'text/html');
            el.replaceChildren(...doc.body.childNodes);
          }
        }
        const pvSel = document.getElementById('sidebar-pv-select');
        const pvField = document.getElementById('postvermerk');
        const applyPv = () => {
          if (pvSel && pvField && pvSel.value) pvField.textContent = pvSel.value;
        };
        if (pvSel) {
          pvSel.addEventListener('input', applyPv);
          pvSel.addEventListener('change', applyPv);
        }
        if (pvToggleBtn) pvToggleBtn.addEventListener('change', applyPv);
        applyPv();
        if (localStorage.getItem('din_custom_font')) {
          document.body.classList.add('font-custom-active');
          const status = document.getElementById('font-status-label');
          if (status) status.textContent = 'Aktiv: Eigene Schrift (WOFF2)';
        }
      } catch (e) {}
    </script>
