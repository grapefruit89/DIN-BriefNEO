name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Stamp build date (letzter Commit-Stand)
        run: |
          DATE=$(git log -1 --format='%cd' --date=format:'%d.%m.%Y')
          sed -i "/id=\"sidebar-build-date\"/s/[0-9][0-9]\.[0-9][0-9]\.[0-9]\{4\}/${DATE}/" website/index.html
          echo "Build-Stand: ${DATE}"
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'website'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
