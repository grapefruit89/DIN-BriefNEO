name: Update PLZ Data

on:
  schedule:
    # Jeden 1. des Monats um 03:00 UTC
    - cron: '0 3 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-plz:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build Columnar PLZ & Grosskunden Datasets
        run: |
          node tools/build_plz_data.mjs --download
          node tools/build_grosskunden_columnar.mjs

      - name: Run Integrity Gates
        run: |
          npm test
          node tools/build_db.js -q

      - name: Commit and push changes if data updated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet website/data/; then
            git add website/data/orte.json.gz website/data/grosskunden.json.gz
            git commit -m "chore(data): automated monthly update of German PLZ datasets [skip ci]"
            git push
          else
            echo "No data changes detected. Everything is up to date."
          fi
