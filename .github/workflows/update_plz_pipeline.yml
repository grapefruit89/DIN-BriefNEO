name: Automated Postal Data Refresh (PLZ & Großempfänger)

on:
  schedule:
    # Runs quarterly at 04:00 UTC on the 1st of January, April, July, and October
    - cron: '0 4 1 */3 *'
  workflow_dispatch:
    # Allows manual trigger at any time from GitHub web UI

permissions:
  contents: write
  pull-requests: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install brotli

      - name: Execute postal data update pipeline
        run: python research/research_scripts/update_plz_pipeline.py

      - name: Detect changes
        id: git-check
        run: |
          git status --porcelain
          if [[ -n $(git status --porcelain research/research_results/ website/data/) ]]; then
            echo "changes_detected=true" >> $GITHUB_OUTPUT
          else
            echo "changes_detected=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push updated assets
        if: steps.git-check.outputs.changes_detected == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(data): automated quarterly update of German PLZ and Großempfänger [skip ci]"
          file_pattern: "research/research_results/ website/data/"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
          commit_author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
