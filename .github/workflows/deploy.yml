name: Deploy to GitHub Pages

# Gate-verkettet: laeuft erst, wenn "Fitness Gate" auf main gruen ist.
# Vorher liefen beide Workflows unabhaengig -> ein roter Gate-Stand wurde
# trotzdem deployed. Bewusst KEIN Datei-Merge der beiden Workflows: eine
# geloeschte Workflow-Datei hinterlaesst einen dauerhaften, nicht loeschbaren
# Eintrag in der Actions-Sidebar (Beleg: die "CI"-Leiche).
on:
  workflow_run:
    workflows: ["Fitness Gate"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    if: >
      github.event_name == 'workflow_dispatch'
      || (github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.event == 'push')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'website'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
